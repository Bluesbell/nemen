<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NEMÉN</title>
  <meta name="description" content="Ki az a NEMÉN?">
  <meta property="og:title" content="NEMÉN">
  <meta property="og:description" content="Ki az a NEMÉN?">
  <meta property="og:image" content="nemen-logo.png">
  <meta name="theme-color" content="#050505">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap">
  <style>
    :root {
      --bg: #050505;
      --fg: #e8e6e1;
      --dim: #6f6d68;
      --faint: #3a3936;
      --ghost: #2a2926;
      --rule: #1c1b19;
      --red: #ff2a2a;
      --cyan: #00e5ff;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: 'IBM Plex Mono', 'Courier New', monospace;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    a { color: var(--dim); text-decoration: none; transition: color .15s; }
    a:hover { color: var(--fg); }

    .grain {
      position: fixed; inset: -4%; width: 108%; height: 108%;
      opacity: .09; pointer-events: none; mix-blend-mode: screen; z-index: 0;
      animation: grain .5s steps(4) infinite;
    }
    .vignette {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background: radial-gradient(ellipse 70% 60% at 50% 45%, rgba(0,0,0,0) 40%, rgba(0,0,0,.85) 100%);
    }

    .page {
      position: relative; z-index: 1;
      min-height: 100svh;
      display: flex; flex-direction: column; justify-content: space-between;
      padding: 36px 48px 40px;
      gap: 48px;
    }

    .centre { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 44px; }
    .wordmark {
      display: block; width: min(980px, 92vw); height: auto;
      filter: drop-shadow(-3px 0 rgba(255,42,42,.75)) drop-shadow(3px 0 rgba(0,229,255,.55));
      animation: reveal 1.6s cubic-bezier(.2,.8,.2,1) both;
    }
    .ask { display: flex; flex-direction: column; align-items: center; gap: 14px; font-size: 15px; letter-spacing: .14em; }
    .prompt { display: flex; align-items: center; gap: 10px; }
    .prompt .gt { color: var(--cyan); }
    .cursor { display: inline-block; width: 9px; height: 17px; background: var(--fg); animation: blink 1.1s steps(1) infinite; }
    .answer { color: var(--dim); font-size: 12px; letter-spacing: .24em; text-transform: uppercase; }

    .bottom { display: flex; justify-content: space-between; align-items: flex-end; gap: 32px; }

    .tracks {
      display: flex; flex-direction: column; gap: 10px; width: 520px; max-width: 100%;
      font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: var(--dim);
      list-style: none; margin: 0; padding: 0;
    }
    .track { display: flex; align-items: center; gap: 20px; padding: 6px 0; border-bottom: 1px solid var(--rule); min-height: 44px; }
    .track .n { width: 26px; color: var(--faint); flex-shrink: 0; }
    .track .t { flex-grow: 1; color: var(--fg); }
    .track .links { display: flex; gap: 18px; font-size: 11px; }
    .track.soon .t { color: var(--ghost); letter-spacing: .1em; }
    .track.soon .soon-label { font-size: 11px; color: var(--ghost); }

    .socials { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 12px; }
    .social {
      display: flex; align-items: center; gap: 14px; padding: 16px 24px; min-height: 44px;
      border: 1px solid var(--fg); font-size: 13px; letter-spacing: .24em; text-transform: uppercase;
      color: var(--fg); transition: background .15s, color .15s; white-space: nowrap;
    }
    .social:hover { background: var(--fg); color: var(--bg); }

    @keyframes reveal {
      0% { opacity: 0; transform: scale(1.06); }
      60% { opacity: 1; transform: scale(1); }
      64% { transform: translateX(-6px); }
      66% { transform: translateX(5px); }
      68% { transform: translateX(0); }
      100% { opacity: 1; transform: scale(1); }
    }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes grain {
      0% { transform: translate(0,0); } 25% { transform: translate(-2%,1%); }
      50% { transform: translate(1%,-2%); } 75% { transform: translate(-1%,-1%); } 100% { transform: translate(2%,2%); }
    }
    @media (prefers-reduced-motion: reduce) {
      .grain, .wordmark, .cursor { animation: none; }
    }

    @media (max-width: 720px) {
      .page { padding: 56px 24px 32px; gap: 40px; }
      .centre { gap: 28px; }
      .ask { font-size: 13px; letter-spacing: .12em; }
      .cursor { width: 8px; height: 15px; }
      .answer { font-size: 11px; }
      .bottom { flex-direction: column; align-items: stretch; gap: 20px; }
      .tracks { width: 100%; font-size: 11px; gap: 6px; }
      .track { gap: 14px; }
      .track .n { width: 22px; }
      .track .links { gap: 14px; font-size: 10px; }
      .socials { flex-direction: column; gap: 10px; }
      .social { justify-content: center; height: 56px; }
    }
  </style>
</head>
<body>

    <rect width="100%" height="100%" filter="url(#noise)"/>
  </svg>
